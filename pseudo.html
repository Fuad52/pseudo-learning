<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pseudo</title>
    <style>
        h3:hover{
            color: aqua;
            background-color: brown;
        }
        input:focus{
            color: chartreuse;
            outline: 0;
        }
        a:visited{
            color: rgb(0, 255, 60);
        }
        li:last-child{
            color: rgb(160, 24, 72);
        }
        li:nth-child(2n){
            color: aquamarine;
        }
    </style>
</head>
<body>
    <h3>this is heading</h3>
    <br>
    <br>
    <input type="text">
    <br>
    <br>
    <a href="https://www.google.com/">ggl</a>
    <br><br>
    <a href="https://www.britannica.com/place/Cyprus">cyprus</a>
    <br>
    <br>
    <ol>
        <li>amar</li>
        <li>baama</li>
        <li>acam</li>
        <li>cdma</li>
        <li>jama</li>
        <li>kama</li>
        <li>hama</li>
        <li>jan</li>
        <li>mas</li>
    </ol>
</body>
</html>
